name: Nexa Windows Build

on:
  workflow_dispatch:
    inputs:
      nexa_version:
        description: Nexa project version
        required: false
        default: manual
      nexa_build_id:
        description: Nexa build record ID
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: nexa-windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: windows-latest
    timeout-minutes: 65
    env:
      CI: "true"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Resolve Node.js runtime
        id: nexa_node
        shell: pwsh
        run: |
          # NEXA_NODE_RUNTIME_RESOLUTION_V1
          $resolved = 24
          if (Test-Path package.json) {
            $package = Get-Content package.json -Raw | ConvertFrom-Json
            $range = [string]$package.engines.node
            if (-not [string]::IsNullOrWhiteSpace($range)) {
              $match = [regex]::Match($range, '(?:>=|\^|~)?\s*(\d{2})(?:\.\d+)?')
              if ($match.Success) { $resolved = [int]$match.Groups[1].Value }
            }
          }
          if ($resolved -lt 20) { $resolved = 20 }
          "version=$resolved" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          Write-Host "Resolved Node.js major: $resolved"
      - name: Configure Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "${{ steps.nexa_node.outputs.version }}"
      - name: Verify Node.js runtime
        shell: pwsh
        run: |
          node --version
          npm --version
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $range = [string]$package.engines.node
          if (-not [string]::IsNullOrWhiteSpace($range)) {
            $required = [regex]::Match($range, '>=\s*(\d+)')
            if ($required.Success) {
              $actual = [int](node -p "process.versions.node.split('.')[0]")
              if ($actual -lt [int]$required.Groups[1].Value) { throw "Configured Node.js $actual does not satisfy engines.node $range" }
            }
          }
      - name: Configure .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Resolve application version
        shell: pwsh
        run: |
          # NEXA_APPLICATION_VERSION_METADATA_V1
          if (-not (Test-Path package.json)) { throw "package.json was not found" }
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $version = [string]$package.version
          if ($version -notmatch "^\d+\.\d+\.\d+([+-][0-9A-Za-z.-]+)?$") { throw "package.json contains an invalid application version" }
          $expected = "${{ inputs.nexa_version }}"
          if ($expected -match "^\d+\.\d+\.\d+([+-][0-9A-Za-z.-]+)?$" -and $expected -ne $version) {
            throw "Requested application version $expected does not match package.json version $version"
          }
          $project = Get-Content nexa.project.json -Raw | ConvertFrom-Json
          $projectVersion = if ($project.application_version) { [string]$project.application_version } else { [string]$project.version }
          if ($projectVersion -ne $version) { throw "nexa.project.json version mismatch" }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Application version: $version"

      - name: Verify build toolchain
        shell: pwsh
        run: |
          node --version
          npm --version
          dotnet --version

      - name: Resolve portable dependency lock
        shell: pwsh
        run: |
          # NEXA_DEPENDENCY_LOCK_PORTABILITY_V1
          if (-not (Test-Path package.json)) { throw "package.json was not found" }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $mustGenerate = -not (Test-Path package-lock.json)
          if (-not $mustGenerate) {
            node -e 'const fs=require("fs");const path="package-lock.json";const lock=JSON.parse(fs.readFileSync(path,"utf8"));let removed=0;const hosts={};function walk(value){if(!value||typeof value!=="object")return;if(typeof value.resolved==="string"&&typeof value.integrity==="string"&&/^https?:\/\//i.test(value.resolved)){let parsed=null;try{parsed=new URL(value.resolved)}catch{}if(parsed&&/\.tgz$/i.test(parsed.pathname)){hosts[parsed.hostname]=(hosts[parsed.hostname]||0)+1;delete value.resolved;removed++}}for(const child of Object.values(value))walk(child)}walk(lock);fs.mkdirSync("artifacts",{recursive:true});fs.writeFileSync("artifacts/dependency-lock-portability.json",JSON.stringify({removed_registry_endpoints:removed,hosts},null,2));if(removed)fs.writeFileSync(path,JSON.stringify(lock,null,2)+"\n");console.log(`Portable dependency lock: removed ${removed} environment-specific registry endpoint(s).`);'
          }
          if ($mustGenerate) {
            npm install --package-lock-only --ignore-scripts --no-audit --no-fund --omit-lockfile-registry-resolved
            if ($LASTEXITCODE -ne 0) { throw "npm could not resolve a portable package-lock.json" }
          }
          if (-not (Test-Path package-lock.json)) { throw "package-lock.json was not generated" }
          node -e 'const fs=require("fs");const pkg=JSON.parse(fs.readFileSync("package.json","utf8"));const lock=JSON.parse(fs.readFileSync("package-lock.json","utf8"));if(!lock.packages||!Object.prototype.hasOwnProperty.call(lock.packages,""))throw new Error("package-lock.json has no root package record");const deps={...(pkg.dependencies||{}),...(pkg.devDependencies||{})};const missing=Object.keys(deps).filter(name=>!Object.prototype.hasOwnProperty.call(lock.packages,`node_modules/${name}`));if(missing.length)throw new Error(`package-lock.json is missing resolved dependencies: ${missing.join(", ")}`);let unsafe=0;function walk(v){if(!v||typeof v!=="object")return;if(typeof v.resolved==="string"&&typeof v.integrity==="string"&&/^https?:\/\//i.test(v.resolved)){let u;try{u=new URL(v.resolved)}catch{}if(u&&/\.tgz$/i.test(u.pathname))unsafe++;}for(const x of Object.values(v))walk(x)}walk(lock);if(unsafe)throw new Error(`package-lock.json still contains ${unsafe} environment-specific registry endpoint(s)`);console.log(`Dependency lock verified for ${Object.keys(deps).length} declared package(s).`);'
          if ($LASTEXITCODE -ne 0) { throw "portable package-lock.json verification failed" }
      - name: Install locked dependencies with watchdog
        shell: pwsh
        run: |
          # NEXA_NPM_INSTALL_SUPERVISOR_V2
          $ErrorActionPreference = "Stop"
          $root = (Get-Location).Path
          $logRoot = Join-Path $root "artifacts/npm-logs"
          New-Item -ItemType Directory -Force -Path $logRoot | Out-Null
          "started=$(Get-Date -Format o)" | Set-Content (Join-Path $logRoot "supervisor-started.txt") -Encoding UTF8
          $env:npm_config_cache = Join-Path $root "artifacts/npm-cache"
          $env:npm_config_audit = "false"
          $env:npm_config_fund = "false"
          $env:npm_config_update_notifier = "false"
          $env:npm_config_fetch_retries = "4"
          $env:npm_config_fetch_retry_factor = "2"
          $env:npm_config_fetch_retry_mintimeout = "10000"
          $env:npm_config_fetch_retry_maxtimeout = "60000"
          $env:npm_config_loglevel = "verbose"
          $env:ELECTRON_CACHE = Join-Path $root "artifacts/electron-cache"
          $env:ELECTRON_GET_USE_PROXY = "1"
          $env:DEBUG = "@electron/get*"
          function Save-NexaNpmContext([string]$Destination) {
            New-Item -ItemType Directory -Force -Path $Destination | Out-Null
            "node=$(node --version)" | Set-Content (Join-Path $Destination "runtime.txt") -Encoding UTF8
            "npm=$(npm --version)" | Add-Content (Join-Path $Destination "runtime.txt") -Encoding UTF8
            Copy-Item package.json,package-lock.json $Destination -Force -ErrorAction SilentlyContinue
            $npmLogs = Join-Path $env:npm_config_cache "_logs"
            if (Test-Path $npmLogs) { Copy-Item (Join-Path $npmLogs "*") $Destination -Force -ErrorAction SilentlyContinue }
          }
          function Invoke-NexaBoundedProcess([string]$Label,[string]$FilePath,[string[]]$Arguments,[int]$TimeoutSeconds,[string]$Destination) {
            New-Item -ItemType Directory -Force -Path $Destination | Out-Null
            $stdout = Join-Path $Destination "$Label.stdout.log"
            $stderr = Join-Path $Destination "$Label.stderr.log"
            ($Arguments -join " ") | Set-Content (Join-Path $Destination "$Label.command.txt") -Encoding UTF8
            $process = Start-Process -FilePath $FilePath -ArgumentList $Arguments -WorkingDirectory $root -PassThru -NoNewWindow -RedirectStandardOutput $stdout -RedirectStandardError $stderr
            $started = Get-Date
            $lastBytes = -1L
            while (-not $process.HasExited) {
              Start-Sleep -Seconds 30
              $process.Refresh()
              $elapsed = [int]((Get-Date) - $started).TotalSeconds
              $bytes = 0L
              if (Test-Path $stdout) { $bytes += (Get-Item $stdout).Length }
              if (Test-Path $stderr) { $bytes += (Get-Item $stderr).Length }
              Write-Host "Nexa dependency heartbeat: $Label elapsed=${elapsed}s log-bytes=$bytes"
              if ($bytes -ne $lastBytes) {
                if (Test-Path $stdout) { Get-Content $stdout -Tail 8 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ } }
                if (Test-Path $stderr) { Get-Content $stderr -Tail 8 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ } }
                $lastBytes = $bytes
              }
              if ($elapsed -ge $TimeoutSeconds -and -not $process.HasExited) {
                "timeout_seconds=$TimeoutSeconds" | Set-Content (Join-Path $Destination "$Label.timeout.txt") -Encoding UTF8
                & taskkill.exe /PID $process.Id /T /F | Out-Null
                Start-Sleep -Seconds 2
                return 124
              }
            }
            $process.WaitForExit()
            if (Test-Path $stdout) { Get-Content $stdout -Tail 200 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ } }
            if (Test-Path $stderr) { Get-Content $stderr -Tail 200 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ } }
            return [int]$process.ExitCode
          }
          $success = $false
          $attemptResults = @()
          for ($attempt = 1; $attempt -le 2; $attempt++) {
            $attemptDir = Join-Path $logRoot "attempt-$attempt"
            New-Item -ItemType Directory -Force -Path $attemptDir | Out-Null
            if ($attempt -gt 1) {
              Remove-Item node_modules -Recurse -Force -ErrorAction SilentlyContinue
              Remove-Item $env:npm_config_cache -Recurse -Force -ErrorAction SilentlyContinue
              New-Item -ItemType Directory -Force -Path $env:npm_config_cache | Out-Null
            }
            Write-Host "Dependency attempt $attempt of 2: install package graph without lifecycle scripts."
            $graphExit = Invoke-NexaBoundedProcess "npm-ci-graph" "npm.cmd" @("ci","--ignore-scripts","--no-audit","--no-fund","--prefer-online","--loglevel=verbose") 480 $attemptDir
            $lifecycleExit = -1
            if ($graphExit -eq 0) {
              Write-Host "Dependency attempt $attempt of 2: run lifecycle scripts under watchdog."
              $lifecycleExit = Invoke-NexaBoundedProcess "npm-rebuild-lifecycle" "npm.cmd" @("rebuild","--foreground-scripts","--loglevel=verbose") 480 $attemptDir
            }
            $electronExit = 0
            if ($graphExit -eq 0 -and $lifecycleExit -eq 0 -and (Test-Path "node_modules/electron/install.js")) {
              Write-Host "Dependency attempt $attempt of 2: prefetch Electron runtime under watchdog."
              $electronExit = Invoke-NexaBoundedProcess "electron-runtime" "node.exe" @("node_modules/electron/install.js") 720 $attemptDir
            }
            Save-NexaNpmContext $attemptDir
            $attemptResults += [ordered]@{ attempt=$attempt; graph_exit=$graphExit; lifecycle_exit=$lifecycleExit; electron_exit=$electronExit }
            if ($graphExit -eq 0 -and $lifecycleExit -eq 0 -and $electronExit -eq 0) { $success = $true; break }
            if ($attempt -lt 2) { Start-Sleep -Seconds 10 }
          }
          $attemptResults | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $logRoot "install-summary.json") -Encoding UTF8
          if (-not $success) { throw "Dependency installation failed after two supervised attempts. Diagnostics were preserved before each timeout or exit." }
      - name: Upload npm installation diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-NPM-Diagnostics-${{ github.run_id }}
          path: |
            artifacts/npm-logs/**
            artifacts/dependency-lock-portability.json
          if-no-files-found: warn
          retention-days: 14
      # NEXA_VALIDATION_MATRIX_V2
      - name: Verify required validation commands
        shell: pwsh
        run: |
          if (-not (Test-Path package.json)) { throw "package.json was not found" }
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $required = @("validate:delivery", "validate:project", "test", "ui:smoke")
          foreach ($name in $required) {
            $property = $package.scripts.PSObject.Properties[$name]
            if ($null -eq $property -or [string]::IsNullOrWhiteSpace([string]$property.Value)) { throw "package.json is missing required script: $name" }
          }
          $smoke = [string]$package.scripts.PSObject.Properties["ui:smoke"].Value
          $match = [regex]::Match($smoke, '(?i)([A-Za-z0-9._/\\-]*ui[-_]?smoke[A-Za-z0-9._/\\-]*\.(?:js|mjs|cjs))')
          if (-not $match.Success) { throw "ui:smoke does not reference a local JavaScript harness" }
          $smokePath = $match.Groups[1].Value -replace '/', [IO.Path]::DirectorySeparatorChar
          if (-not (Test-Path $smokePath)) { throw "Required UI smoke test is missing: $smokePath" }

      - name: Run delivery validator
        id: nexa_delivery
        continue-on-error: true
        run: npm run validate:delivery

      - name: Run internal application validator
        id: nexa_internal
        continue-on-error: true
        run: npm run validate:project

      - name: Run unit and acceptance tests
        id: nexa_tests
        continue-on-error: true
        run: npm test

      - name: Run Electron UI smoke test
        id: nexa_ui_smoke
        continue-on-error: true
        run: npm run ui:smoke

      - name: Validation gate
        shell: pwsh
        run: |
          $checks = @(
            [pscustomobject]@{ name = "Delivery validator"; outcome = "${{ steps.nexa_delivery.outcome }}" },
            [pscustomobject]@{ name = "Internal validator"; outcome = "${{ steps.nexa_internal.outcome }}" },
            [pscustomobject]@{ name = "Unit and acceptance tests"; outcome = "${{ steps.nexa_tests.outcome }}" },
            [pscustomobject]@{ name = "Electron UI smoke"; outcome = "${{ steps.nexa_ui_smoke.outcome }}" }
          )
          $lines = @("Nexa validation matrix", "Commit: ${{ github.sha }}", "Run: ${{ github.run_id }}", "")
          foreach ($check in $checks) { $lines += ("{0}: {1}" -f $check.name, $check.outcome) }
          $lines | Set-Content nexa-validation-summary.txt -Encoding UTF8
          $checks | ConvertTo-Json | Set-Content nexa-validation-summary.json -Encoding UTF8
          Get-Content nexa-validation-summary.txt
          $failed = @($checks | Where-Object { $_.outcome -ne "success" })
          if ($failed.Count -gt 0) {
            throw ("Validation failed in: " + (($failed | ForEach-Object { $_.name }) -join ", "))
          }
      - name: Run internal application validator
        shell: pwsh
        run: npm run validate

      - name: Run unit tests
        shell: pwsh
        run: npm test

      - name: Run Electron UI smoke test
        shell: pwsh
        run: npm run ui:smoke

      - name: Build installer and portable app
        shell: pwsh
        run: |
          npm run build:win
          if ($LASTEXITCODE -ne 0) { throw "Windows build failed" }

      - name: Verify Native Helper inside packaged application
        shell: pwsh
        run: |
          $helper = "release\win-unpacked\resources\bin\NexaShareControl.Native.exe"
          if (-not (Test-Path $helper)) { throw "Packaged Native Helper missing: $helper" }
          $size = (Get-Item $helper).Length
          if ($size -lt 500000) { throw "Packaged Native Helper is unexpectedly small: $size bytes" }
          Write-Host "PACKAGED_NATIVE_HELPER_OK=$helper"
          Write-Host "PACKAGED_NATIVE_HELPER_BYTES=$size"

      - name: Test packaged EXE startup
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = (Resolve-Path "release\win-unpacked\NexaShareControl.exe").Path
          $report = Join-Path $env:RUNNER_TEMP "nexa-share-control-startup.json"
          Remove-Item $report -Force -ErrorAction SilentlyContinue
          $env:NEXA_STARTUP_SMOKE_FILE = $report
          $process = Start-Process -FilePath $exe -PassThru
          $deadline = (Get-Date).AddSeconds(25)
          while ((Get-Date) -lt $deadline -and -not (Test-Path $report) -and -not $process.HasExited) {
            Start-Sleep -Milliseconds 500
            $process.Refresh()
          }
          if (-not (Test-Path $report)) {
            if (-not $process.HasExited) { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
            throw "Packaged NexaShareControl.exe did not report successful startup."
          }
          $startup = Get-Content $report -Raw | ConvertFrom-Json
          if (-not $startup.ok) { throw "Packaged startup report was not OK." }
          Write-Host "PACKAGED_EXE_STARTUP_OK"
          Get-Content $report

      - name: Validate Windows delivery artifacts
        shell: pwsh
        run: |
          # NEXA_WINDOWS_ARTIFACT_DELIVERY_V3
          $required = @(
            "release\NexaShareControl-Setup-$env:APP_VERSION-x64.exe",
            "release\NexaShareControl-Portable-$env:APP_VERSION-x64.exe",
            "release\NexaShareControl-$env:APP_VERSION-x64.zip"
          )
          foreach ($file in $required) {
            if (-not (Test-Path $file)) { throw "Missing Windows artifact: $file" }
            $size = (Get-Item $file).Length
            if ($size -lt 1000000) { throw "Windows artifact too small: $file ($size bytes)" }
            Write-Host "ARTIFACT_OK=$file bytes=$size"
          }

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zipPath = (Resolve-Path "release\NexaShareControl-$env:APP_VERSION-x64.zip").Path
          $zip = [System.IO.Compression.ZipFile]::OpenRead($zipPath)
          try {
            $helperEntry = $zip.Entries | Where-Object {
              $_.FullName -match 'resources[/\\]bin[/\\]NexaShareControl\.Native\.exe$'
            } | Select-Object -First 1
            if ($null -eq $helperEntry) { throw "Windows ZIP does not contain NexaShareControl.Native.exe" }
            Write-Host "WINDOWS_ZIP_NATIVE_HELPER_OK=$($helperEntry.FullName)"
          } finally {
            $zip.Dispose()
          }

      - name: Upload exact Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-Windows-Installer-${{ env.APP_VERSION }}-Build-${{ github.run_number }}
          path: release/NexaShareControl-Setup-${{ env.APP_VERSION }}-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact portable Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-Windows-Portable-${{ env.APP_VERSION }}-Build-${{ github.run_number }}
          path: release/NexaShareControl-Portable-${{ env.APP_VERSION }}-x64.exe
          if-no-files-found: error
          retention-days: 30

      - name: Upload exact Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: Nexa-Windows-ZIP-${{ env.APP_VERSION }}-Build-${{ github.run_number }}
          path: release/NexaShareControl-${{ env.APP_VERSION }}-x64.zip
          if-no-files-found: error
          retention-days: 30
